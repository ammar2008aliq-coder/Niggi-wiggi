<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090508">

<title>For Moheeta ❤️</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;
}

body{
  min-height:100svh;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:#080507;
  position:relative;
  padding:18px;
}

/* Background */
.glow{
  position:fixed;
  inset:-30%;
  background:
    radial-gradient(circle at 50% 38%,rgba(180,18,55,.28),transparent 35%),
    radial-gradient(circle at 20% 80%,rgba(110,10,35,.2),transparent 30%);
  animation:drift 9s ease-in-out infinite alternate;
  pointer-events:none;
}

.stars{
  position:fixed;
  inset:0;
  opacity:.45;
  background-image:radial-gradient(#fff 1px,transparent 1px);
  background-size:55px 55px;
  animation:stars 20s linear infinite;
  pointer-events:none;
}

/* Loading screen */
.loader{
  position:fixed;
  z-index:20;
  inset:0;
  display:grid;
  place-items:center;
  background:#080507;
  transition:opacity .8s,visibility .8s;
}

.loader.hide{
  opacity:0;
  visibility:hidden;
}

.loader-box{
  text-align:center;
  animation:float 2s ease-in-out infinite;
}

.loader-heart{
  font-size:58px;
  filter:drop-shadow(0 0 20px rgba(255,50,100,.6));
  animation:pulse 1.1s ease-in-out infinite;
}

.loader-text{
  margin-top:12px;
  color:#d8aeb9;
  font-size:13px;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* Pages */
.card{
  position:relative;
  z-index:2;
  width:min(100%,560px);
  padding:clamp(32px,8vw,58px) clamp(20px,6vw,46px);
  text-align:center;

  border:1px solid rgba(255,72,110,.24);
  border-radius:32px;

  background:
    linear-gradient(
      145deg,
      rgba(25,10,16,.88),
      rgba(8,6,9,.93)
    );

  box-shadow:
    0 30px 100px rgba(0,0,0,.7),
    inset 0 1px rgba(255,255,255,.05),
    0 0 70px rgba(210,25,65,.1);

  backdrop-filter:blur(18px);

  animation:cardIn .9s cubic-bezier(.16,1,.3,1);
}

.eyebrow{
  display:inline-block;
  margin-bottom:18px;
  color:#ff6c88;
  font-weight:800;
  letter-spacing:3px;
  text-transform:uppercase;
  font-size:11px;
}

h1{
  font-size:clamp(34px,10vw,62px);
  line-height:1.02;
  margin:12px 0 12px;
  letter-spacing:-2px;
}

h2{
  font-size:clamp(22px,6vw,30px);
  margin:0 0 26px;
  letter-spacing:-.5px;
}

p{
  color:#e8cfd4;
  font-size:clamp(16px,4.5vw,19px);
  line-height:1.6;
  margin:12px auto 28px;
  max-width:450px;
}

/* Buttons */
.buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  min-height:58px;
}

.yes,
.no{
  appearance:none;
  border-radius:999px;
  padding:16px 25px;
  font-size:16px;
  font-weight:900;
  letter-spacing:.2px;
  min-width:126px;
}

.yes{
  border:0;
  color:#fff;
  background:linear-gradient(135deg,#ff315c,#cf123c);
  box-shadow:0 10px 28px rgba(233,35,79,.3);
  cursor:pointer;
  transition:transform .2s,box-shadow .2s;
}

.yes:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 15px 35px rgba(233,35,79,.42);
}

.yes:active{
  transform:scale(.96);
}

.no{
  background:#211319;
  color:#806b72;
  border:1px solid #42202b;
  cursor:not-allowed;
}

/* Hidden pages */
.hidden{
  display:none;
}

/* Final page */
.yay{
  font-size:clamp(42px,12vw,78px);
  font-weight:1000;
  color:#ff4268;
  line-height:.98;
  letter-spacing:-3px;
  text-shadow:0 0 28px rgba(255,55,100,.25);
  animation:yayIn .8s cubic-bezier(.16,1.4,.3,1);
}

.sub{
  font-size:clamp(20px,5vw,25px);
  color:#fff;
  font-weight:800;
}

.emoji-row{
  font-size:clamp(30px,9vw,42px);
  letter-spacing:5px;
}

/* Confetti */
.confetti{
  position:fixed;
  z-index:10;
  width:8px;
  height:15px;
  top:-24px;
  border-radius:3px;
  animation:fall var(--dur) cubic-bezier(.2,.7,.3,1) forwards;
  pointer-events:none;
}

.ring{
  position:fixed;
  z-index:4;
  width:12px;
  height:12px;
  border:2px solid #ff5378;
  border-radius:50%;
  pointer-events:none;
  animation:ring 1s ease-out forwards;
}

/* Animations */
@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.96);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes yayIn{
  from{
    opacity:0;
    transform:scale(.5) rotate(-4deg);
  }

  to{
    opacity:1;
    transform:scale(1) rotate(0);
  }
}

@keyframes pulse{
  50%{
    transform:scale(1.1);
  }
}

@keyframes float{
  50%{
    transform:translateY(-7px);
  }
}

@keyframes drift{
  to{
    transform:scale(1.12) translate(3%,-2%);
  }
}

@keyframes stars{
  to{
    transform:translateY(55px);
  }
}

@keyframes fall{
  to{
    transform:
      translate3d(
        calc((var(--x) - 50) * 1vw),
        110svh,
        0
      )
      rotate(900deg);
    opacity:0;
  }
}

@keyframes ring{
  to{
    transform:scale(18);
    opacity:0;
  }
}

/* Mobile */
@media(max-width:480px){

  body{
    padding:12px;
  }

  .card{
    border-radius:26px;
    padding:34px 20px;
  }

  .buttons{
    gap:9px;
  }

  .yes,
  .no{
    min-width:0;
    flex:1;
    padding:15px 12px;
  }

  h1{
    letter-spacing:-1.5px;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition:none!important;
  }
}
</style>
</head>


<body>

<!-- Background -->
<div class="glow"></div>


<!-- Loading -->
<div class="loader" id="loader">
  <div class="loader-box">
    <div class="loader-heart">❤️</div>
    <div class="loader-text">
      loading something important...
    </div>
  </div>
</div>


<!-- PAGE 1 -->
<main class="card" id="page1">

  <div class="eyebrow">
    page 1
  </div>

  <h1>
    Ello Niggi
  </h1>

  <button class="yes" onclick="show('page2')">
    next →
  </button>

</main>


<!-- PAGE 2 -->
<main class="card hidden" id="page2">

  <div class="eyebrow">
    page 2
  </div>

  <p>
    I've been meaning to ask u smth...
  </p>

  <button class="yes" onclick="show('page3')">
    mhm?
  </button>

</main>


<!-- PAGE 3 -->
<main class="card hidden" id="page3">

  <div class="eyebrow">
    page 3
  </div>

  <h2>
    Will you be my girl?
  </h2>

  <p>
    <i>
      -your sharmeela four eyed Nigga
    </i>
  </p>

  <div class="buttons">

    <button class="yes" onclick="yes()">
      YES ❤️
    </button>

    <button class="no" aria-disabled="true">
      NO (Lameeee)
    </button>

  </div>

</main>


<!-- YES PAGE -->
<main class="card hidden" id="yay">

  <div class="yay">
    YAYAYAYAYY!!!
  </div>

  <p class="sub">
    YESSS????? W FR
  </p>

  <p>

  </p>

  <div class="emoji-row">
    LES GOOOOOOOOOOOOOO
  </div>

</main>


<script>

/* Remove loading screen */
window.addEventListener("load", () => {

  setTimeout(() => {

    document
      .getElementById("loader")
      .classList.add("hide");

  },1100);

});


/* Switch pages */
function show(id){

  document
    .querySelectorAll(".card")
    .forEach(card => {

      card.classList.add("hidden");

    });

  document
    .getElementById(id)
    .classList.remove("hidden");

}


/* YES button */
function yes(){

  show("yay");


  /* Confetti */
  for(let i = 0; i < 170; i++){

    let e = document.createElement("i");

    e.className = "confetti";

    e.style.left =
      Math.random() * 100 + "vw";

    e.style.background =
      [
        "#ff234f",
        "#fff",
        "#ff718b",
        "#8f1534"
      ][
        Math.floor(Math.random() * 4)
      ];

    e.style.setProperty(
      "--dur",
      (2 + Math.random() * 2.5) + "s"
    );

    e.style.setProperty(
      "--x",
      (Math.random() * 100 - 50).toFixed(1)
    );

    e.style.animationDelay =
      Math.random() * 1.1 + "s";

    document.body.appendChild(e);


    setTimeout(() => {
      e.remove();
    },5000);

  }


  /* Expanding rings */
  for(let i = 0; i < 7; i++){

    let r = document.createElement("i");

    r.className = "ring";

    r.style.left =
      (45 + Math.random() * 10) + "vw";

    r.style.top =
      (35 + Math.random() * 30) + "vh";

    r.style.animationDelay =
      i * .08 + "s";

    document.body.appendChild(r);


    setTimeout(() => {
      r.remove();
    },1400);

  }

}

</script>

</body>
</html>
